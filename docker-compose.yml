services:
  postgres:
    image: postgres:16
    container_name: pareto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pareto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pareto}
      POSTGRES_DB: ${POSTGRES_DB:-pareto}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pareto} -d ${POSTGRES_DB:-pareto}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
